<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pantau Tiket — PST BPS</title>
<?!= include('Styles') ?>
<style>
  body{align-items:center}.card{text-align:center}
  .office{font-size:13px;color:var(--muted);font-weight:500;margin-bottom:16px}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:12.5px;font-weight:600}
  .pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
  .st-WAITING{background:var(--primary-soft);color:var(--primary)}.st-IN_SERVICE{background:var(--warn-soft);color:var(--warn)}
  .st-DONE{background:var(--ok-soft);color:var(--ok)}.st-CANCELLED{background:var(--danger-soft);color:var(--danger)}
  .no{font-size:68px;font-weight:700;letter-spacing:-.03em;line-height:1;margin:14px 0 4px;color:var(--text)}
  .who{font-size:16px;font-weight:600;margin-bottom:18px}
  .msg{font-size:14px;padding:12px 14px;border-radius:8px;margin-bottom:16px;text-align:left;border:1px solid var(--border);background:var(--bg)}
  .msg.warn{background:var(--warn-soft);border-color:#fde68a;color:#78350f}.msg.done{background:var(--ok-soft);border-color:#a7f3d0;color:#065f46}
  .est{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border);border-radius:8px;margin-bottom:16px}
  .est div{padding:12px}.est div+div{border-left:1px solid var(--border)}
  .est b{display:block;font-size:26px;font-weight:700;color:var(--primary)}.est span{font-size:12px;color:var(--muted)}
  .rate{border:1px solid var(--border);border-radius:10px;padding:18px;text-align:left}
  .rate h3{font-size:15px;font-weight:600}.rate p.h{font-size:12.5px;color:var(--muted);margin:2px 0 12px}
  .stars{display:flex;justify-content:center;gap:6px;margin-bottom:8px}
  .star{background:none;border:0;cursor:pointer;color:var(--border-strong);font-size:34px;padding:2px;transition:color .12s}
  .star.active{color:#f59e0b}
  .sl{text-align:center;font-size:12.5px;color:var(--muted);height:18px;margin-bottom:10px}
  .note{font-size:12px;color:var(--muted);margin-top:16px}
</style>
</head>
<body>
<?!= include('Icons') ?>
<div class="card">
  <div id="loadingWrap" style="padding:28px 0;color:var(--muted)"><span class="spinner" style="border-color:var(--border);border-top-color:var(--primary);width:28px;height:28px;margin-bottom:12px"></span><p>Memuat data tiket…</p></div>
  <div id="content" style="display:none">
    <div class="office" id="kantorNama">PST BPS</div>
    <span class="pill" id="statusBadge">—</span>
    <div class="no" id="ticketNumber">—</div>
    <div class="who" id="visitorName">—</div>
    <div class="msg" id="statusMessage"></div>
    <div class="est" id="estimasiBox" style="display:none">
      <div><b id="antrianDiDepan">0</b><span>Antrian di depan</span></div>
      <div><b id="estimasiMenit">0</b><span>Estimasi (menit)</span></div>
    </div>
    <div class="kv" id="ticketInfo"></div>
    <div id="ratingArea"></div>
    <div class="note" id="refreshNote">Halaman diperbarui otomatis setiap 5 detik.</div>
  </div>
</div>
<script>
  const ENTRY_ID = <?!= JSON.stringify(entryId || "") ?>;
  let selectedRating=0,lastStatus=null;
  const STAR_LABELS=['','Sangat buruk','Buruk','Cukup','Baik','Sangat baik'];
  const STAR='<svg class="ic" viewBox="0 0 24 24" style="width:1em;height:1em"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z" fill="currentColor"/></svg>';
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function purposeLabel(p){return {PST:'Pelayanan Statistik Terpadu',RAPAT:'Rapat / Kerjasama',LAINNYA:'Keperluan Lainnya'}[p]||p||'—';}
  function statusLabel(s){return {WAITING:'Menunggu',IN_SERVICE:'Sedang dilayani',DONE:'Selesai',CANCELLED:'Dibatalkan'}[s]||s;}
  function row(k,v){return '<div><span class="k">'+k+'</span><span class="v">'+esc(v)+'</span></div>';}
  function loadKantorInfo(){google.script.run.withSuccessHandler(function(i){if(i&&i.nama)document.getElementById('kantorNama').textContent=i.nama;}).withFailureHandler(function(){}).getKantorInfo();}

  function renderTicket(res){
    document.getElementById('loadingWrap').style.display='none';
    document.getElementById('content').style.display='block';
    const msg=document.getElementById('statusMessage');
    if(!res.ok){
      document.getElementById('statusBadge').style.display='none';
      document.getElementById('ticketNumber').textContent='—'; document.getElementById('visitorName').textContent='';
      msg.className='msg warn'; msg.textContent=res.error||'Tiket tidak ditemukan.';
      ['estimasiBox'].forEach(i=>document.getElementById(i).style.display='none');
      document.getElementById('ticketInfo').innerHTML=''; document.getElementById('ratingArea').innerHTML='';
      document.getElementById('refreshNote').style.display='none'; return;
    }
    const e=res.entry, b=document.getElementById('statusBadge');
    b.style.display='inline-flex'; b.className='pill st-'+e.status; b.textContent=statusLabel(e.status);
    document.getElementById('ticketNumber').textContent=e.ticket; document.getElementById('visitorName').textContent=e.visitorName;
    document.getElementById('estimasiBox').style.display='none';
    if(e.status==='WAITING'){
      msg.className='msg'; msg.textContent='Mohon tunggu. Nomor Anda akan dipanggil lewat layar dan suara di kantor.';
      document.getElementById('estimasiBox').style.display='grid';
      document.getElementById('antrianDiDepan').textContent=res.antrianDiDepan||0; document.getElementById('estimasiMenit').textContent=res.estimasiMenit||0;
    } else if(e.status==='IN_SERVICE'){ msg.className='msg warn'; msg.textContent='Anda sedang dilayani'+(e.petugas?' oleh '+e.petugas:'')+'. Silakan menuju loket PST.';
    } else if(e.status==='DONE'){ msg.className='msg done'; msg.textContent='Pelayanan telah selesai. Terima kasih atas kunjungan Anda.';
    } else { msg.className='msg warn'; msg.textContent='Tiket ini telah dibatalkan.'; }
    document.getElementById('ticketInfo').innerHTML=row('Tujuan',purposeLabel(e.purpose))+(e.serviceType?row('Jenis layanan',e.serviceType):'')+
      (e.addressInstansi?row('Instansi',e.addressInstansi):'')+row('Jumlah orang',e.visitorCount);
    renderRatingArea(e);
    if(e.status==='DONE'||e.status==='CANCELLED') document.getElementById('refreshNote').style.display='none';
    lastStatus=e.status;
  }
  function renderRatingArea(e){
    const a=document.getElementById('ratingArea');
    if(e.status!=='DONE'){a.innerHTML='';return;}
    if(e.rating){a.innerHTML='<div class="rate"><p style="font-size:13.5px;color:var(--ok);font-weight:600">Terima kasih, Anda memberi nilai '+e.rating+'/5.</p></div>';return;}
    if(document.getElementById('starsRow')) return; // jangan render ulang saat pengguna sedang mengisi
    let stars=''; for(let i=1;i<=5;i++) stars+='<button type="button" class="star" data-val="'+i+'" aria-label="'+i+' bintang">'+STAR+'</button>';
    a.innerHTML='<div class="rate"><h3>Bagaimana pelayanan kami?</h3><p class="h">Penilaian Anda membantu kami meningkatkan layanan PST.</p>'+
      '<div class="stars" id="starsRow">'+stars+'</div><div class="sl" id="starLabel">Ketuk bintang untuk menilai</div>'+
      '<div class="field"><label>Dinilai untuk petugas</label><select id="ratingPetugasSelect"><option>Memuat…</option></select></div>'+
      '<div class="field"><textarea id="ratingComment" style="min-height:64px" placeholder="Komentar tambahan (opsional)"></textarea></div>'+
      '<button class="btn btn-primary" id="ratingSubmitBtn">Kirim penilaian</button></div>';
    document.querySelectorAll('#starsRow .star').forEach(s=>s.addEventListener('click',function(){selectStar(parseInt(this.dataset.val));}));
    document.getElementById('ratingSubmitBtn').addEventListener('click',submitVisitorRating);
    populatePetugas(e);
  }
  function populatePetugas(e){
    const names=[]; if(e.petugas) names.push(e.petugas);
    (e.collaborators||[]).forEach(c=>{if(names.indexOf(c)===-1)names.push(c);});
    function finish(){const s=document.getElementById('ratingPetugasSelect'); if(!s)return;
      s.innerHTML=names.length?names.map(n=>'<option value="'+esc(n)+'">'+esc(n)+'</option>').join(''):'<option value="">Tidak diketahui</option>';}
    google.script.run.withSuccessHandler(function(r){((r&&r.data)||[]).forEach(p=>{if(names.indexOf(p.nama)===-1)names.push(p.nama);});finish();}).withFailureHandler(finish).getPetugasTersediaHariIni(null);
  }
  function selectStar(v){selectedRating=v; document.getElementById('starLabel').textContent=STAR_LABELS[v];
    document.querySelectorAll('#starsRow .star').forEach(s=>s.classList.toggle('active',parseInt(s.dataset.val)<=v));}
  function submitVisitorRating(){
    if(!selectedRating){alert('Pilih bintang terlebih dahulu.');return;}
    const btn=document.getElementById('ratingSubmitBtn'); btn.disabled=true; btn.textContent='Menyimpan…';
    const reset=function(){btn.disabled=false;btn.textContent='Kirim penilaian';};
    const sel=document.getElementById('ratingPetugasSelect');
    google.script.run.withSuccessHandler(function(r){ if(r.ok) fetchTicket(); else {alert(r.error||'Gagal menyimpan penilaian.');reset();} })
      .withFailureHandler(function(er){alert('Error: '+er.message);reset();})
      .submitRatingWithPetugas(ENTRY_ID,selectedRating,document.getElementById('ratingComment').value.trim(),sel?sel.value:'');
  }
  function fetchTicket(){
    if(!ENTRY_ID){renderTicket({ok:false,error:'Tautan tiket tidak valid.'});return;}
    google.script.run.withSuccessHandler(renderTicket).withFailureHandler(function(er){renderTicket({ok:false,error:er.message});}).getTicketLive(ENTRY_ID);
  }
  loadKantorInfo(); fetchTicket();
  setInterval(function(){ if(lastStatus==='DONE'||lastStatus==='CANCELLED')return; fetchTicket(); },5000);
</script>
</body>
</html>
