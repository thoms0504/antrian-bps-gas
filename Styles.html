<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#f4f6f9;--surface:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;--border-strong:#cbd5e1;
    --primary:#1e40af;--primary-hover:#1e3a8a;--primary-soft:#eff4ff;--ok:#047857;--ok-soft:#ecfdf5;
    --warn:#b45309;--warn-soft:#fffbeb;--danger:#b91c1c;--danger-soft:#fef2f2;--radius:10px}
  html{-webkit-font-smoothing:antialiased}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
    display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;line-height:1.5}
  .ic{width:1.15em;height:1.15em;flex-shrink:0;vertical-align:-.2em}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px;width:100%;max-width:520px;
    box-shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.05)}
  .brand{display:flex;align-items:center;gap:14px;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--border)}
  .brand-mark{width:44px;height:44px;border-radius:10px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px}
  .brand h1{font-size:18px;font-weight:700;letter-spacing:-.01em}
  .brand p{font-size:13px;color:var(--muted)}
  .field{margin-bottom:18px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  label .opt{color:var(--muted);font-weight:400}
  label .req{color:var(--danger)}
  input[type=text],input[type=email],input[type=tel],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border-strong);
    border-radius:8px;font:inherit;font-size:14.5px;color:var(--text);background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
  textarea{resize:vertical;min-height:84px}
  input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(30,64,175,.15)}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .seg-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border:1px solid var(--border-strong);border-radius:8px;
    background:#fff;color:var(--muted);font-size:12.5px;font-weight:500;text-align:center;cursor:pointer;transition:all .15s;line-height:1.3}
  .seg-btn .ic{font-size:20px}
  .seg-btn:hover{border-color:var(--primary)}
  .seg-btn.active{border-color:var(--primary);background:var(--primary-soft);color:var(--primary);font-weight:600}
  .sub-wrap{display:none;margin-top:12px}.sub-wrap.visible{display:block}
  .stepper{display:inline-flex;align-items:center;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden}
  .stepper button{width:40px;height:40px;border:0;background:#fff;font-size:18px;color:var(--primary);cursor:pointer}
  .stepper button:hover{background:var(--primary-soft)}
  .stepper span{min-width:44px;text-align:center;font-weight:600;border-inline:1px solid var(--border)}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px 16px;border-radius:8px;font:inherit;font-size:14.5px;
    font-weight:600;cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s;border:1px solid transparent}
  .btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-hover)}
  .btn-primary:disabled{opacity:.6;cursor:not-allowed}
  .btn-ghost{background:#fff;color:var(--text);border-color:var(--border-strong);margin-top:10px}.btn-ghost:hover{background:var(--bg)}
  .kv{border:1px solid var(--border);border-radius:8px;padding:4px 14px;margin:18px 0;text-align:left}
  .kv div{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13.5px}
  .kv div:last-child{border-bottom:0}.kv .k{color:var(--muted)}.kv .v{font-weight:600;text-align:right}
  .toast{display:none;position:fixed;top:16px;left:50%;transform:translateX(-50%);padding:11px 18px;border-radius:8px;color:#fff;
    font-size:13.5px;font-weight:600;box-shadow:0 8px 24px rgba(15,23,42,.2);z-index:99}
  .spinner,.loading{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  @media (max-width:480px){.card{padding:22px 18px}.row2{grid-template-columns:1fr}}
</style>
